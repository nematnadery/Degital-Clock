<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Vazirmatn:wght@300;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <main class="clock">
    <div class="time">
      <span class="unit" id="h">00</span>
      <span class="sep">:</span>
      <span class="unit" id="m">00</span>
      <span class="sep">:</span>
      <span class="unit" id="s">00</span>
      <span class="ampm" id="ampm"></span>
    </div>

    <div class="bar"><span id="bar"></span></div>

    <p class="date" id="date"></p>
    <p class="greet" id="greet"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
